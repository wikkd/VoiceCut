name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 用 dev 清单（含 pytest / ruff）——此前只装了 requirements.txt + ruff，
          # 而 Lint 步一直失败挡在前面，所以 Test 步的 "pytest: command not found"
          # 从未暴露：CI 其实从来没有跑过测试。
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Icon check
        # 图标类的「用到 ⊆ 定义」+ 文件存在性自检。漏一个映射不会报错，
        # 只会让图标渲染成 1em 实心方块 —— 视觉上极易漏掉，所以放到 CI 里守。
        run: python scripts/check_icons.py
      - name: Test
        run: pytest -q -m "not env"
